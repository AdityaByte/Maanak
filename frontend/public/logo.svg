<svg viewBox="270 270 525 485" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Maanak logo</title>
  <desc>A navy circular seal containing a document icon connected via a teal neural network to a large gradient checkmark that extends past the seal's edge.</desc>

  <defs>
    <linearGradient id="checkGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#17A98A"/>
      <stop offset="100%" stop-color="#0E8262"/>
    </linearGradient>
  </defs>

  <!-- outer seal ring -->
  <circle cx="512" cy="512" r="228" fill="#FFFFFF" stroke="#0B2A43" stroke-width="12"/>

  <!-- document icon -->
  <path d="M 350 420
           L 425 420
           L 460 455
           L 460 570
           L 350 570
           Z"
        fill="#FFFFFF" stroke="#0B2A43" stroke-width="8" stroke-linejoin="round"/>
  <path d="M 425 420 L 425 455 L 460 455 Z" fill="#0B2A43"/>
  <line x1="372" y1="480" x2="435" y2="480" stroke="#0B2A43" stroke-width="7" stroke-linecap="round"/>
  <line x1="372" y1="505" x2="435" y2="505" stroke="#0B2A43" stroke-width="7" stroke-linecap="round"/>
  <line x1="372" y1="530" x2="415" y2="530" stroke="#0B2A43" stroke-width="7" stroke-linecap="round"/>

  <!-- upper node cluster -->
  <g stroke="#17A98A" stroke-width="4" fill="none">
    <line x1="432" y1="392" x2="492" y2="378"/>
    <line x1="492" y1="378" x2="556" y2="398"/>
    <line x1="556" y1="398" x2="592" y2="378"/>
    <line x1="556" y1="398" x2="620" y2="440"/>
    <line x1="470" y1="452" x2="492" y2="378"/>
    <line x1="470" y1="452" x2="556" y2="398"/>
  </g>
  <g fill="#17A98A">
    <circle cx="432" cy="392" r="10"/>
    <circle cx="492" cy="378" r="12"/>
    <circle cx="556" cy="398" r="10"/>
    <circle cx="592" cy="378" r="9"/>
    <circle cx="620" cy="440" r="9"/>
    <circle cx="470" cy="452" r="9"/>
  </g>

  <!-- lower node cluster -->
  <g stroke="#17A98A" stroke-width="4" fill="none">
    <line x1="410" y1="592" x2="466" y2="612"/>
    <line x1="466" y1="612" x2="522" y2="600"/>
    <line x1="522" y1="600" x2="578" y2="616"/>
    <line x1="466" y1="612" x2="500" y2="648"/>
  </g>
  <g fill="#17A98A">
    <circle cx="410" cy="592" r="9"/>
    <circle cx="466" cy="612" r="11"/>
    <circle cx="522" cy="600" r="9"/>
    <circle cx="578" cy="616" r="9"/>
    <circle cx="500" cy="648" r="9"/>
  </g>

  <!-- checkmark, breaking the seal edge -->
  <path d="M 528 512
           L 600 578
           L 762 392"
        fill="none" stroke="url(#checkGrad)" stroke-width="52"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
